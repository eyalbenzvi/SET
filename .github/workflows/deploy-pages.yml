name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required for the official Pages deployment action.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; newer pushes supersede queued ones.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        # VITE_BASE must match the path the site is served from. `configure-pages`
        # reports it as `base_path` (`/<repo>` for a project site, empty for a
        # user/organisation site or a custom domain).
        #
        # VITE_API_BASE is the deployed Worker URL. Set it as a repository
        # variable: Settings -> Secrets and variables -> Actions -> Variables ->
        # New repository variable, named SET_API_BASE, e.g.
        # https://set-game-worker.<your-subdomain>.workers.dev
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/
          VITE_API_BASE: ${{ vars.SET_API_BASE }}
        run: |
          if [ -z "$VITE_API_BASE" ]; then
            echo "::error::Repository variable SET_API_BASE is not set. Set it to your deployed Worker URL (see README)."
            exit 1
          fi
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
