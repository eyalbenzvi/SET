name: Deploy Worker to Cloudflare

# Runs on a push to the repository's default branch, and can also be started by
# hand from the Actions tab.
#
# Why a push trigger at all, when deploys should be deliberate? GitHub only lists
# a workflow in the Actions tab once it has a non-manual trigger or a past run —
# a manual-only workflow on a repository without a `main` branch is invisible,
# with no button to press. The job guard below keeps the behaviour deliberate:
# nothing deploys except from the default branch, whatever that branch is called.
#
# Requires one repository secret:
#   CLOUDFLARE_API_TOKEN — an API token with the "Edit Cloudflare Workers"
#                          template permissions.
# And one repository variable:
#   CLOUDFLARE_ACCOUNT_ID — your Cloudflare account id.
#
# Deploying by hand with `npm run deploy --workspace worker` needs neither and is
# the documented default (see README).
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: wrangler deploy
    # Only ever deploys from the default branch. Comparing against
    # `default_branch` rather than a hard-coded name means renaming the trunk (to
    # `main`, say) needs no change here.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Repository secret CLOUDFLARE_API_TOKEN is not set (see this workflow's comments)."
            exit 1
          fi

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy --workspace worker
