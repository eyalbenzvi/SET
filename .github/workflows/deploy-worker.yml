name: Deploy Worker to Cloudflare

# Runs on a push to `main`, and can also be started by hand from the Actions tab.
#
# Why a push trigger at all, when deploys should be deliberate? GitHub only lists
# a workflow in the Actions tab once it has a non-manual trigger or a past run —
# a manual-only workflow is invisible, with no button to press. The job guard
# below keeps the behaviour deliberate: nothing deploys except from `main`.
#
# Requires one repository secret:
#   CLOUDFLARE_API_TOKEN — an API token with the "Edit Cloudflare Workers"
#                          template permissions.
# And one repository variable:
#   CLOUDFLARE_ACCOUNT_ID — your Cloudflare account id.
#
# Deploying by hand with `npm run deploy --workspace worker` needs neither and is
# the documented default (see README).
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: wrangler deploy
    # Only ever deploys from `main`, by name.
    #
    # This deliberately does not consult `github.event.repository.default_branch`.
    # That earlier guard meant whichever branch happened to be the repository
    # default could ship straight to production, and a feature branch that was
    # briefly the default did exactly that — deploying an unreviewed commit while
    # the Pages half of the same release was blocked. Naming the branch keeps
    # production tied to the branch that PRs are reviewed and merged into,
    # whatever the repository setting says.
    #
    # `workflow_dispatch` is held to the same rule, so a manual run has to be
    # started from `main` as well.
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Repository secret CLOUDFLARE_API_TOKEN is not set (see this workflow's comments)."
            exit 1
          fi

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy --workspace worker
